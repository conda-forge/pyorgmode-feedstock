{% set version = "0.03c" %}
{% set name = "PyOrgMode" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 798c89a4d84b0127c26e04377776a0a5f001194976edca93127aa5edddb01ffb

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}

  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - {{ name }}

about:
  home: https://github.com/bjonnh/PyOrgMode
  license: GPLv3
  # https://github.com/bjonnh/PyOrgMode/pull/29
  # license_file: LICENSE
  summary: A python class for reading and writing orgmode files

extra:
  recipe-maintainers:
    - jschueller
